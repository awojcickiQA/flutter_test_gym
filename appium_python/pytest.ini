[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Kluczowe testy dymne weryfikujące podstawowy start i działanie
    navigation: Testy nawigacji i routingu między modułami
    forms: Testy formularzy, walidacji, pól tekstowych i kontrolek
    gestures: Testy gestów W3C (tap, double-tap, long-press, drag & drop)
    lists: Testy filtrowania, przewijania i stanów pustych list
    async_arena: Testy asynchroniczności, odporności na flakiness i timerów
    overlays: Testy okien dialogowych, arkuszy dolnych i paska bocznego
    shop: Testy pełnego scenariusza zakupowego E2E w sklepie
    device: Testy integracji ze sprzętem, uprawnień i trybu offline
    accessibility: Testy dostępności, semantyki i kierunku tekstu RTL
    inspector: Testy wbudowanego panelu inspekcji selektorów
